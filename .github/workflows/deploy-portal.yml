name: Deploy Portal

# Builds the portal SPA (Vite) and uploads it to Power Pages as a CODE SITE with
# `pac pages upload-code-site`. NOTE: the FIRST upload CREATES the site in an
# INACTIVE state — activate it once via the Power Pages home -> Inactive sites ->
# "VelOps Support" -> Activate (RUNBOOK stap ④). Later uploads update the active
# site in place; no re-activation needed.
run-name: Deploy portal (first upload creates an INACTIVE site — activate once, RUNBOOK ④)

on:
  workflow_dispatch:
    inputs:
      target-environment:
        description: 'Environment URL override (leave empty to use repo variable DATAVERSE_URL)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: windows-latest
    env:
      # vars.DATAVERSE_URL: repo VARIABLE — environment URL of "VelOps Customer" (RUNBOOK stap ①).
      # The optional workflow input overrides it for a one-off run.
      DATAVERSE_URL: ${{ inputs.target-environment || vars.DATAVERSE_URL }}
      # secrets.POWERPLATFORM_CLIENT_ID: repo SECRET — client id of the SPN app registration (RUNBOOK stap ②/③).
      POWERPLATFORM_CLIENT_ID: ${{ secrets.POWERPLATFORM_CLIENT_ID }}
      # secrets.POWERPLATFORM_CLIENT_SECRET: repo SECRET — client secret of that SPN (RUNBOOK stap ③).
      POWERPLATFORM_CLIENT_SECRET: ${{ secrets.POWERPLATFORM_CLIENT_SECRET }}
      # secrets.POWERPLATFORM_TENANT_ID: repo SECRET — Entra tenant id (RUNBOOK stap ③).
      POWERPLATFORM_TENANT_ID: ${{ secrets.POWERPLATFORM_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: portal/package-lock.json

      # Both VITE_ values may be EMPTY before the Function App exists (RUNBOOK stap ⑤):
      # the build still succeeds and the AI assistant reports itself as not configured.
      # After stap ⑤ sets the var + secret, re-run this workflow once so the bundle
      # picks them up (Vite inlines env vars at build time).
      - name: Build portal SPA
        env:
          # vars.AI_PROXY_URL: repo VARIABLE — https://velops-customer-ai.azurewebsites.net/api/messages (RUNBOOK stap ⑤).
          VITE_AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}
          # secrets.AI_PROXY_FUNCTION_KEY: repo SECRET — DEDICATED revocable function key; it ends up
          # in the public bundle, so treat it as rotatable spend-control, not a secret (docs/SECURITY.md).
          VITE_AI_PROXY_KEY: ${{ secrets.AI_PROXY_FUNCTION_KEY }}
        run: |
          cd portal
          npm ci
          npm run build

      # Installs the pac CLI onto the runner's PATH for the raw pac steps below.
      - uses: microsoft/powerplatform-actions/actions-install@v1

      # Flags verified against Microsoft Learn (pac auth reference): SPN profile via
      # --applicationId / --clientSecret / --tenant, targeted at --environment (URL works).
      # actions-install puts pac in a temp dir and only exports POWERPLATFORMTOOLS_PACPATH
      # (it is NOT on PATH for raw shell steps), so invoke it via that variable.
      - name: Authenticate pac as the service principal
        shell: pwsh
        run: |
          & $env:POWERPLATFORMTOOLS_PACPATH auth create --applicationId $env:POWERPLATFORM_CLIENT_ID --clientSecret $env:POWERPLATFORM_CLIENT_SECRET --tenant $env:POWERPLATFORM_TENANT_ID --environment $env:DATAVERSE_URL

      # Flags verified against Microsoft Learn (create-code-sites): --rootPath points at the
      # site folder; portal/powerpages.config.json supplies compiledPath (./dist) and the
      # default landing page; --siteName pins the site match explicitly (CLI args win over
      # the config file). First run creates the site under "Inactive sites" (RUNBOOK ④).
      # The content upload against a freshly provisioned (still inactive) site fails
      # transiently on individual web files (PortalFileContentUploadFailed) — each
      # attempt gets further and the upload is idempotent, so retry up to 4 times.
      - name: Upload code site
        shell: pwsh
        run: |
          $max = 4
          for ($i = 1; $i -le $max; $i++) {
            & $env:POWERPLATFORMTOOLS_PACPATH pages upload-code-site --rootPath portal --siteName "VelOps Support"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "upload-code-site attempt $i of $max failed (exit $LASTEXITCODE); retrying in 30s..."
            Start-Sleep -Seconds 30
          }
          Write-Error "upload-code-site failed after $max attempts"
          exit 1
