name: Deploy AI proxy (Function App velops-customer-ai)

# Automates RUNBOOK stap ⑤ as far as GitHub can reach: creates/updates the
# Azure Function App via ai-proxy/deploy.ps1, sets the Anthropic key from the
# repo secret, and provisions a dedicated function key named "portal" (value is
# NEVER logged — copy it from the Azure Portal into AI_PROXY_FUNCTION_KEY).
#
# One-time prerequisites (RUNBOOK stap ⑤):
#   - repo secret AZURE_CREDENTIALS: output of
#     az ad sp create-for-rbac --name velops-customer-ai-deploy \
#       --role Contributor --scopes /subscriptions/<subscription-id> --sdk-auth
#   - repo secret ANTHROPIC_API_KEY: a FRESH Anthropic key
# Afterwards: copy function key "portal" (Azure Portal) into repo secret
# AI_PROXY_FUNCTION_KEY, set repo variable AI_PROXY_URL, and run
# Run Ops Script -> scripts/sync-spa-bundle.mjs so the SPA picks it up.

on:
  workflow_dispatch:
    inputs:
      allowed-origins:
        description: 'CORS origin(s) for the proxy (comma-separated)'
        required: false
        type: string
        default: 'https://velopssupport.powerappsportals.com'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check prerequisites
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "$AZURE_CREDENTIALS" ]; then
            echo "::error::Repo secret AZURE_CREDENTIALS is not set — see RUNBOOK stap ⑤."
            exit 1
          fi
          # Must be EXACTLY the JSON block from `az ad sp create-for-rbac ... --sdk-auth`
          # ({ ... } only — no WARNING lines or prompt text copied along from the shell).
          if ! printf '%s' "$AZURE_CREDENTIALS" | jq -e 'type == "object"' > /dev/null 2>&1; then
            echo "::error::AZURE_CREDENTIALS is not valid JSON. Re-paste ONLY the { ... } block from the az ad sp create-for-rbac output (no warning/prompt lines)."
            exit 1
          fi
          for key in clientId clientSecret subscriptionId tenantId; do
            if ! printf '%s' "$AZURE_CREDENTIALS" | jq -e --arg k "$key" 'has($k)' > /dev/null 2>&1; then
              echo "::error::AZURE_CREDENTIALS is missing the '$key' field — use the --sdk-auth output format."
              exit 1
            fi
          done
          echo "AZURE_CREDENTIALS looks valid (JSON with the required fields)."

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Deploy Function App
        shell: pwsh
        run: ./ai-proxy/deploy.ps1 -AllowedOrigins "${{ inputs.allowed-origins }}"

      - name: Set Anthropic key (from repo secret, never logged)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Repo secret ANTHROPIC_API_KEY is empty — the proxy will return errors until it is set (RUNBOOK stap ⑤)."
          else
            az functionapp config appsettings set -n velops-customer-ai -g velops-customer-ai-rg \
              --settings "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" --output none
            echo "ANTHROPIC_API_KEY app setting configured."
          fi

      - name: Set Dataverse SPN creds for the portal-write endpoint (never logged)
        env:
          DATAVERSE_URL: ${{ vars.DATAVERSE_URL }}
          POWERPLATFORM_CLIENT_ID: ${{ secrets.POWERPLATFORM_CLIENT_ID }}
          POWERPLATFORM_CLIENT_SECRET: ${{ secrets.POWERPLATFORM_CLIENT_SECRET }}
          POWERPLATFORM_TENANT_ID: ${{ secrets.POWERPLATFORM_TENANT_ID }}
        run: |
          # The portalwrite function creates tickets/messages with the admin SPN
          # (the Power Pages portal Web API refuses portal-user associations on
          # this site). Same SPN as the CI ops scripts; secret stays server-side.
          if [ -z "$POWERPLATFORM_CLIENT_ID" ] || [ -z "$POWERPLATFORM_CLIENT_SECRET" ] || [ -z "$POWERPLATFORM_TENANT_ID" ] || [ -z "$DATAVERSE_URL" ]; then
            echo "::warning::One of DATAVERSE_URL / POWERPLATFORM_* is empty — the portal-write endpoint will fail until they are set."
          else
            az functionapp config appsettings set -n velops-customer-ai -g velops-customer-ai-rg --output none \
              --settings \
                "DATAVERSE_URL=$DATAVERSE_URL" \
                "POWERPLATFORM_CLIENT_ID=$POWERPLATFORM_CLIENT_ID" \
                "POWERPLATFORM_CLIENT_SECRET=$POWERPLATFORM_CLIENT_SECRET" \
                "POWERPLATFORM_TENANT_ID=$POWERPLATFORM_TENANT_ID"
            echo "Dataverse SPN app settings configured for portalwrite."
          fi

      - name: Ensure function key 'portal' on both functions, same value (not logged)
        run: |
          # messages (Anthropic proxy) + portalwrite (Dataverse writes) share ONE
          # key value so the SPA needs a single AI_PROXY_FUNCTION_KEY secret.
          az functionapp function keys set -g velops-customer-ai-rg -n velops-customer-ai \
            --function-name messages --key-name portal --output none
          KEY=$(az functionapp function keys list -g velops-customer-ai-rg -n velops-customer-ai \
            --function-name messages --query portal -o tsv)
          az functionapp function keys set -g velops-customer-ai-rg -n velops-customer-ai \
            --function-name portalwrite --key-name portal --key-value "$KEY" --output none
          echo "Function key 'portal' provisioned on messages + portalwrite (same value)."
          echo ""
          echo "NEXT (RUNBOOK stap ⑤):"
          echo "  1. Azure Portal -> velops-customer-ai -> Functions -> messages -> Function keys:"
          echo "     copy key 'portal' into repo secret AI_PROXY_FUNCTION_KEY (works for portalwrite too)."
          echo "  2. Set repo variable AI_PROXY_URL = https://velops-customer-ai.azurewebsites.net/api/messages"
          echo "  3. Actions -> Run Ops Script -> scripts/sync-spa-bundle.mjs (SPA picks up the AI + write config)."
